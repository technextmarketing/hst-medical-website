<body>
<script>/* entry: the HST Medical logo builds itself from its parts, then flies into the header. Once per visit; click, key, scroll or Skip ends it; never under reduced motion. Parts: assets/img/intro (cut by _src/logo_cutout.py intro_slices). */
(function(){var d=document,r=d.documentElement;try{if(sessionStorage.getItem('hst-intro')||matchMedia('(prefers-reduced-motion: reduce)').matches)return;sessionStorage.setItem('hst-intro','1');}catch(e){return;}
r.classList.add('intro');var P='{{ROOT}}assets/img/intro/ix-',im=function(n){return '<img class="ix-part ix-'+n+'" src="'+P+n+'.webp" alt="" decoding="sync">';};
d.body.insertAdjacentHTML('afterbegin','<div class="intro-splash" aria-hidden="true"><div class="ix-bg"><i class="ix-bloom"></i><i class="ix-ring r1"></i><i class="ix-ring r2"></i><i class="ix-ring r3"></i></div><div class="ix-stage"><div class="ix-logo">'+im('mark')+im('hst')+im('med')+im('kowa')+'<span class="ix-sheen"></span></div><p class="ix-tag"><span>Higher</span><i></i><span>Stronger</span><i></i><span>Together</span></p></div><button class="ix-skip" type="button" tabindex="-1">Skip</button><i class="ix-bar"></i></div>');
var s=d.body.firstElementChild,lg=s.querySelector('.ix-logo'),gone=false,t1=0,started=false;
var finish=function(){if(gone)return;gone=true;clearTimeout(t1);r.classList.remove('intro');s.classList.add('ix-exit');
 var tg=d.querySelector('.site-header .brand');
 if(tg&&lg.animate){var a=lg.getBoundingClientRect(),b=tg.getBoundingClientRect(),sc=b.height/a.height;
  lg.style.transition='none';
  lg.animate([{transform:getComputedStyle(lg).transform,opacity:1},{transform:'translate('+(b.left-a.left)+'px,'+(b.top-a.top)+'px) scale('+sc+')',opacity:.9,offset:.82},{transform:'translate('+(b.left-a.left)+'px,'+(b.top-a.top)+'px) scale('+sc+')',opacity:0}],{duration:900,easing:'cubic-bezier(.7,0,.2,1)',fill:'forwards'});}
 setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},980);};
var start=function(){if(started)return;started=true;s.classList.add('ix-go');t1=setTimeout(finish,3600);};
var imgs=[].slice.call(s.querySelectorAll('img')),left=imgs.length;imgs.forEach(function(i){if(i.complete)left--;else i.addEventListener('load',function(){if(--left<=0)start();});i.addEventListener('error',function(){if(--left<=0)start();});});
if(left<=0)start();setTimeout(start,900);setTimeout(function(){if(!gone)finish();},6000);
s.addEventListener('pointermove',function(e){s.style.setProperty('--ix',(e.clientX/innerWidth-.5).toFixed(3));s.style.setProperty('--iy',(e.clientY/innerHeight-.5).toFixed(3));});
s.addEventListener('click',finish);addEventListener('keydown',finish,{once:true});addEventListener('wheel',finish,{once:true,passive:true});addEventListener('touchmove',finish,{once:true,passive:true});})();</script>

  </div>
